name: moremore-fetch
on:
  # GitHub 예약(cron) 워크플로는 best-effort 라 지연·드롭된다(실측: 2026-08-27 예약분 미발동).
  # 단일 슬롯 대신 KST 평일 9슬롯으로 다중화해, 한 슬롯이 드롭돼도 뒤 슬롯이 메운다.
  # 드롭의 주원인이 정시 직후 큐 폭주라 분(minute)을 시간대마다 흩었다(같은 :05 로 몰면 드롭이 상관됨).
  # 오후까지 도는 이유: 벤더가 당일 중 이미지·메뉴명을 점진적으로 채운다(실측: 이미지가 KST 11:12 에 업로드됨).
  # 같은 내용의 재수집은 아래 커밋 스텝의 `git diff --staged --quiet` 가 이미 커밋을 막는다.
  schedule:
    - cron: '13 22 * * 0-4'   # KST 월~금 07:13 (UTC 일~목 22:13)
    - cron: '29 23 * * 0-4'   # KST 월~금 08:29 (UTC 일~목 23:29)
    - cron: '41 0 * * 1-5'    # KST 월~금 09:41 (UTC 월~금 00:41)
    - cron: '7 1 * * 1-5'     # KST 월~금 10:07 (UTC 월~금 01:07)
    - cron: '23 2 * * 1-5'    # KST 월~금 11:23 (UTC 월~금 02:23)
    - cron: '37 3 * * 1-5'    # KST 월~금 12:37 (UTC 월~금 03:37)
    - cron: '51 4 * * 1-5'    # KST 월~금 13:51 (UTC 월~금 04:51)
    - cron: '17 6 * * 1-5'    # KST 월~금 15:17 (UTC 월~금 06:17) — 석식 이미지가 오후에 올라오는 경우 대비
    - cron: '33 8 * * 1-5'    # KST 월~금 17:33 (UTC 월~금 08:33) — 위와 동일(당일 마지막 보강 슬롯)
  workflow_dispatch: {}
permissions:
  contents: write
# 슬롯이 1개에서 9개로 늘었으므로 겹쳐 도는 실행(수동 dispatch·지연 발동)을 직렬화한다.
# cancel-in-progress: false — 진행 중인 수집을 죽이면 그날의 유일한 성공 슬롯을 날릴 수 있다.
concurrency:
  group: moremore-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-moremore.mjs
        env:
          # 빈 응답을 "실패"로 볼지 여부. 벤더가 당일 중 데이터를 점진적으로 채우므로 이른
          # 슬롯의 빈 응답은 정상일 수 있다 — 매 슬롯 실패로 띄우면 평일마다 빨간 잡이 쌓여
          # 신호가 죽는다. 당일 마지막 슬롯(KST 17:33)에서만 엄격 판정한다.
          MOREMORE_STRICT: ${{ github.event.schedule == '33 8 * * 1-5' && '1' || '0' }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/moremore-latest.json
          git diff --staged --quiet || git commit -m "chore: 모락모락 오늘의 메뉴 자동 갱신 ($(date -u -d '9 hours' +%Y-%m-%d))"
          # 체크아웃 이후 사람/다른 슬롯이 push 했으면 non-fast-forward 로 실패하므로 리베이스 후 push.
          git pull --rebase
          git push
