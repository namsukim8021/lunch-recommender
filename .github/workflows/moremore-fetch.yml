name: moremore-fetch
on:
  schedule:
    - cron: '0 0 * * 1-5'  # 매 평일 09:00 KST(=UTC 00:00)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-moremore.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/moremore-latest.json
          git diff --staged --quiet || git commit -m "chore: 모락모락 오늘의 메뉴 자동 갱신 ($(date -u -d '9 hours' +%Y-%m-%d))"
          git push
