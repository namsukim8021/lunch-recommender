name: verify-moremore-fetch
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Call moremore API from Actions runner
        run: |
          set -e
          TODAY=$(date -u -d '9 hours' +%Y%m%d) # KST = UTC+9
          echo "Requesting for date: $TODAY"
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --url 'https://puls2.pulmuone.com/src/sql/menu/today_sql.php' \
            -H 'Accept: application/json, text/javascript, */*; q=0.01' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            -H 'Origin: https://puls2.pulmuone.com' \
            -H 'Referer: https://puls2.pulmuone.com/src/php/menu/today.php' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            --data-raw "requestId=search_schMenu&requestUrl=%2Fsrc%2Fsql%2Fmenu%2Ftoday_sql.php&requestMode=1&requestParam=%7B%22srchOperCd%22%3A%22O000002%22%2C%22srchAssignCd%22%3A%22S000758%22%2C%22srchCurDay%22%3A%22${TODAY}%22%2C%22srchCurShopclsCd%22%3A%22%22%2C%22custCd%22%3A%22%22%7D" \
            --max-time 15)
          echo "HTTP_CODE=$HTTP_CODE"
          echo "----- response head -----"
          head -c 1000 /tmp/resp.json
          echo ""
          echo "----- response size -----"
          wc -c /tmp/resp.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Non-200 response: $HTTP_CODE"
            exit 1
          fi
          if ! grep -q '"data"' /tmp/resp.json; then
            echo "::error::Response does not contain expected 'data' field"
            exit 1
          fi
          echo "VERIFIED: server-side fetch from GitHub Actions runner succeeded with real data"
